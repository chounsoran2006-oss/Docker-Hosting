<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Student Manager</h1>
  <div class="stats">
    <div><b id="statTotal">0</b><span>Students</span></div>
    <div><b id="statAvg">–</b><span>Average score</span></div>
    <div><b id="statTop">–</b><span>Top score</span></div>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <h2 id="formTitle">Add student</h2>
    <form id="studentForm" novalidate>
      <input type="hidden" id="editId">
      <label>Full name
        <input id="name" required maxlength="60">
      </label>
      <div class="row">
        <label>Gender
          <select id="gender"><option>Female</option><option>Male</option></select>
        </label>
        <label>Class
          <select id="grade">
            <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
            <option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
          </select>
        </label>
      </div>
      <label>Email
        <input id="email" type="email">
      </label>
      <label>Phone
        <input id="phone" type="tel">
      </label>
      <label>Score (0–100)
        <input id="score" type="number" min="0" max="100" required>
      </label>
      <p id="error" class="error" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary" id="saveBtn">Save student</button>
        <button type="button" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
  </section>

  <section class="list">
    <div class="tools">
      <input id="search" type="search" placeholder="Search name or email" aria-label="Search students">
      <select id="filterGrade" aria-label="Filter by class"><option value="">All classes</option></select>
      <button id="exportBtn" type="button">Export CSV</button>
    </div>
    <p id="databaseStatus" class="database-status" role="status">Connecting to database…</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Class</th><th>Contact</th><th>Score</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No students yet. Add the first one using the form.</p>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
