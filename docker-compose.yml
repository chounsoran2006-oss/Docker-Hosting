services:
  student-manager:
    build: .
    container_name: student-manager
    ports:
      - "8080:80"
    depends_on:
      student-api:
        condition: service_healthy
    restart: unless-stopped
  student-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    volumes:
      - student-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  student-data:
